name: Python Trusted Publishing demo

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Nach erfolgreichem Build auf TestPyPI publizieren?"
        type: boolean
        default: false
        required: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build tools installieren
        run: python -m pip install build twine
      - name: Wheel und sdist bauen
        run: python -m build
      - name: Metadaten pruefen und gebautes Wheel testen
        run: |
          python -m twine check --strict dist/*
          python -m pip install --no-deps dist/*.whl
          python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v5
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-distributions
          path: dist/
      - name: OIDC-Upload und Publish-Attestierungen
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
