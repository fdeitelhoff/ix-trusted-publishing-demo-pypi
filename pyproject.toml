[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ix-trusted-publishing-demo-pypi"
version = "0.0.1"
description = "Kleine Demo fuer Trusted Publishing bei TestPyPI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
